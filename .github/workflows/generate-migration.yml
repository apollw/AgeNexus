name: Generate EF migration

on:
  push:
    branches: ["feat/scoring-and-competition-core"]
    paths: [".github/workflows/generate-migration.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ConnectionStrings__AgeNexus: Host=localhost;Port=5432;Database=agenexus;Username=postgres;Password=postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore AgeNexus.slnx

      - name: Restore local tools
        run: dotnet tool restore

      - name: Generate migration
        run: >
          dotnet ef migrations add AddCompetitionCore
          --project src/AgeNexus.Infrastructure
          --startup-project src/AgeNexus.Web
          --output-dir Persistence/Migrations

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AgeNexus.Infrastructure/Persistence/Migrations
          git commit -m "feat: migração do núcleo competitivo"
          git push
